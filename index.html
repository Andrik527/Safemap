<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SafeMap</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

:root{
  --night:#0D1B2A;
  --night2:#112236;
  --night3:#1A3350;
  --red:#FF3B30;
  --red-dim:rgba(255,59,48,.15);
  --green:#1EBF72;
  --amber:#F5A623;
  --sky:#8EA9BD;
  --white:#FFFFFF;
  --white70:rgba(255,255,255,.70);
  --white30:rgba(255,255,255,.30);
  --white10:rgba(255,255,255,.10);
  --white06:rgba(255,255,255,.06);
}

body{background:var(--night);color:var(--white);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}

/* ── Fondo: mapa blur ── */
.map-blur-bg{
  position:absolute;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 60% 50% at 70% 40%, rgba(30,191,114,.06) 0%, transparent 70%),
    radial-gradient(ellipse 40% 60% at 20% 60%, rgba(255,59,48,.05) 0%, transparent 60%),
    var(--night);
}

/* Puntos de incidente animados */
.pulse-dot{
  position:absolute;border-radius:50%;
  animation:pulse-ring 3s ease-out infinite;
}
.pulse-dot::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  animation:pulse-fill 3s ease-out infinite;
}
.pd-1{width:8px;height:8px;top:28%;left:62%;background:var(--red);animation-delay:0s}
.pd-1::before{background:var(--red)}
.pd-2{width:8px;height:8px;top:55%;left:30%;background:var(--amber);animation-delay:1.2s}
.pd-2::before{background:var(--amber)}
.pd-3{width:6px;height:6px;top:42%;left:75%;background:var(--red);animation-delay:2.1s}
.pd-3::before{background:var(--red)}

@keyframes pulse-ring{
  0%{box-shadow:0 0 0 0 currentColor}
  70%{box-shadow:0 0 0 18px transparent}
  100%{box-shadow:0 0 0 0 transparent}
}
.pd-1{box-shadow:0 0 0 0 rgba(255,59,48,.5)}
.pd-2{box-shadow:0 0 0 0 rgba(245,166,35,.5)}
.pd-3{box-shadow:0 0 0 0 rgba(255,59,48,.5)}

/* Líneas de calle abstractas */
.street-lines{
  position:absolute;inset:0;z-index:0;opacity:.04;
  background-image:
    linear-gradient(90deg,var(--sky) 1px,transparent 1px),
    linear-gradient(0deg,var(--sky) 1px,transparent 1px);
  background-size:80px 80px;
  transform:rotate(-8deg) scale(1.3);
}

/* ── Contenido principal ── */
.page{
  position:relative;z-index:1;
  width:100%;max-width:420px;
  padding:2rem 1.5rem 2.5rem;
  display:flex;flex-direction:column;
  gap:0;
}

/* ── Logo / marca ── */
.brand{
  display:flex;align-items:center;gap:.6rem;
  margin-bottom:2.5rem;
}
.brand-icon{
  width:36px;height:36px;background:var(--red);
  border-radius:8px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.brand-name{
  font-size:1.05rem;font-weight:600;letter-spacing:-.01em;color:var(--white);
}
.brand-loc{
  margin-left:.5rem;font-size:.8rem;font-weight:400;
  color:var(--sky);border-left:1px solid var(--white10);padding-left:.6rem;
}

/* ── Titular ── */
.hero-title{
  font-size:clamp(2rem,7vw,2.8rem);
  font-weight:300;
  letter-spacing:-.035em;
  line-height:1.08;
  color:var(--white);
  margin-bottom:.6rem;
}
.hero-title strong{font-weight:600}
.hero-sub{
  font-size:.92rem;color:var(--sky);
  line-height:1.55;margin-bottom:2.2rem;
}

/* ── Live badge ── */
.live-row{
  display:flex;align-items:center;gap:.75rem;
  margin-bottom:2rem;
}
.live-badge{
  display:inline-flex;align-items:center;gap:.4rem;
  background:var(--red-dim);border:1px solid rgba(255,59,48,.25);
  border-radius:999px;padding:.28rem .7rem;
  font-size:.72rem;font-weight:500;color:var(--red);
}
.live-dot{width:6px;height:6px;background:var(--red);border-radius:50%;animation:blink 1.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.live-stats{font-size:.78rem;color:var(--sky)}
.live-stats b{color:var(--white);font-weight:500}

/* ── Botón invitado ── */
.btn-guest-full{
  width:100%;
  background:var(--white06);
  border:1px solid var(--white10);
  border-radius:10px;
  padding:.88rem 1.25rem;
  color:var(--white70);
  font-family:'DM Sans',system-ui,sans-serif;
  font-size:.9rem;font-weight:400;
  cursor:pointer;text-align:left;
  display:flex;align-items:center;justify-content:space-between;
  text-decoration:none;
  transition:background .15s,border-color .15s;
  margin-bottom:1.25rem;
}
.btn-guest-full:hover{background:var(--white10);border-color:var(--white30)}
.btn-guest-full span{display:flex;align-items:center;gap:.55rem}
.btn-guest-arrow{color:var(--white30);font-size:1.1rem}

/* ── Divisor ── */
.divider{
  display:flex;align-items:center;gap:.75rem;
  margin-bottom:1.25rem;
}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--white10)}
.divider span{font-size:.78rem;color:var(--sky);white-space:nowrap}

/* ── Form ── */
.form{display:flex;flex-direction:column;gap:.75rem}

.field{display:flex;flex-direction:column;gap:.3rem}
.field label{
  font-size:.78rem;font-weight:500;color:var(--sky);
  display:flex;justify-content:space-between;
}
.field-forgot{font-weight:400;color:var(--sky);text-decoration:none;font-size:.78rem;transition:color .12s}
.field-forgot:hover{color:var(--white)}

.field input{
  background:var(--night2);
  border:1px solid var(--white10);
  border-radius:8px;
  padding:.82rem 1rem;
  font-family:'DM Sans',system-ui,sans-serif;
  font-size:.92rem;color:var(--white);
  outline:none;transition:border-color .15s,box-shadow .15s;
  -webkit-appearance:none;
}
.field input::placeholder{color:rgba(142,169,189,.4)}
.field input:focus{border-color:rgba(255,255,255,.3);box-shadow:0 0 0 3px rgba(255,255,255,.05)}
.field input.err{border-color:rgba(255,59,48,.5);box-shadow:0 0 0 3px rgba(255,59,48,.08)}

.pw-wrap{position:relative}
.pw-wrap input{padding-right:2.8rem}
.pw-toggle{
  position:absolute;right:.85rem;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;
  color:rgba(142,169,189,.6);display:flex;padding:.1rem;
  border-radius:4px;transition:color .12s;
}
.pw-toggle:hover{color:var(--white)}

.field-err{font-size:.75rem;color:var(--red);min-height:.9em}

/* ── Botón principal ── */
.btn-main{
  width:100%;background:var(--red);border:none;border-radius:10px;
  padding:.9rem 1.5rem;
  font-family:'DM Sans',system-ui,sans-serif;
  font-size:.95rem;font-weight:600;color:var(--white);
  cursor:pointer;margin-top:.25rem;
  display:flex;align-items:center;justify-content:center;gap:.5rem;
  transition:background .15s,transform .1s;
  position:relative;overflow:hidden;
}
.btn-main:hover{background:#e02d22}
.btn-main:active{transform:scale(.98)}
.btn-main:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn-main-text{flex:1;text-align:center}

.spin{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ── Google ── */
.btn-google{
  width:100%;background:transparent;
  border:1px solid var(--white10);border-radius:10px;
  padding:.82rem 1.5rem;
  font-family:'DM Sans',system-ui,sans-serif;
  font-size:.9rem;font-weight:400;color:var(--white70);
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.6rem;
  transition:background .15s,border-color .15s;
}
.btn-google:hover{background:var(--white06);border-color:var(--white30)}

/* ── Registro ── */
.register-link{
  text-align:center;font-size:.82rem;color:var(--sky);
  margin-top:1.25rem;
}
.register-link a{color:var(--white);font-weight:500;text-decoration:none;border-bottom:1px solid var(--white30);padding-bottom:1px}
.register-link a:hover{border-color:var(--white)}

/* ── Responsive ── */
@media(max-width:480px){
  .page{padding:1.75rem 1.25rem 2rem}
  .hero-title{font-size:2rem}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="map-blur-bg"></div>
<div class="street-lines"></div>
<div class="pulse-dot pd-1"></div>
<div class="pulse-dot pd-2"></div>
<div class="pulse-dot pd-3"></div>

<div class="page">

  <div class="brand">
    <div class="brand-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="white"/>
      </svg>
    </div>
    <span class="brand-name">SafeMap<span class="brand-loc">Xalapa</span></span>
  </div>

  <h1 class="hero-title">Xalapa,<br><strong>en tiempo real.</strong></h1>
  <p class="hero-sub">Reporta incidentes y sigue alertas activas en la zona de xalapa </p>

  <div class="live-row">
    <span class="live-badge"><span class="live-dot"></span>En vivo</span>
    <span class="live-stats"><b>3</b> reportes activos ahora</span>
  </div>

  <a href="map.html" class="btn-guest-full">
    <span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
      </svg>
      Explorar sin cuenta
    </span>
    <span class="btn-guest-arrow">›</span>
  </a>

  <div class="divider"><span>o inicia sesión</span></div>

  <form class="form" id="loginForm" novalidate>
    <div class="field">
      <label for="email">Correo</label>
      <input type="email" id="email" placeholder="tu@correo.com" autocomplete="email" required/>
      <span class="field-err" id="emailErr"></span>
    </div>

    <div class="field">
      <label for="password">Contraseña <a href="#" class="field-forgot">¿La olvidaste?</a></label>
      <div class="pw-wrap">
        <input type="password" id="password" placeholder="Mínimo 8 caracteres" autocomplete="current-password" required/>
        <button type="button" class="pw-toggle" id="pwToggle" aria-label="Mostrar contraseña">
          <svg id="eyeIco" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <span class="field-err" id="passErr"></span>
    </div>

    <button type="submit" class="btn-main" id="submitBtn">
      <span class="btn-main-text">Entrar</span>
      <svg id="spinIco" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="spin" hidden>
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
      </svg>
    </button>

    <button type="button" class="btn-google" id="gBtn">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continuar con Google
    </button>
  </form>

  <p class="register-link">¿No tienes cuenta? <a href="register.html">Crea una gratis</a></p>
</div>

<script>
const form=document.getElementById('loginForm'),emailI=document.getElementById('email'),passI=document.getElementById('password'),emailE=document.getElementById('emailErr'),passE=document.getElementById('passErr'),submitBtn=document.getElementById('submitBtn'),spinIco=document.getElementById('spinIco'),pwToggle=document.getElementById('pwToggle'),eyeIco=document.getElementById('eyeIco');
pwToggle.addEventListener('click',()=>{const h=passI.type==='password';passI.type=h?'text':'password';eyeIco.innerHTML=h?`<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>`:`<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`});
function ve(){const v=emailI.value.trim();if(!v){emailE.textContent='Ingresa tu correo';emailI.classList.add('err');return false}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){emailE.textContent='Formato inválido';emailI.classList.add('err');return false}emailE.textContent='';emailI.classList.remove('err');return true}
function vp(){const v=passI.value;if(!v){passE.textContent='Ingresa tu contraseña';passI.classList.add('err');return false}if(v.length<8){passE.textContent='Mínimo 8 caracteres';passI.classList.add('err');return false}passE.textContent='';passI.classList.remove('err');return true}
emailI.addEventListener('blur',ve);passI.addEventListener('blur',vp);
emailI.addEventListener('input',()=>{if(emailI.classList.contains('err'))ve()});
passI.addEventListener('input',()=>{if(passI.classList.contains('err'))vp()});
form.addEventListener('submit',async e=>{e.preventDefault();if(!ve()||!vp())return;submitBtn.disabled=true;submitBtn.querySelector('.btn-main-text').textContent='Entrando...';spinIco.hidden=false;await new Promise(r=>setTimeout(r,1400));window.location.href='map.html'});
document.getElementById('gBtn').addEventListener('click',()=>alert('Google próximamente.'));
</script>
</body>
</html>
