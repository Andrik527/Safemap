<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SafeMap — Crear cuenta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/auth.css" />
  <style>
    .auth-form .field-group + .field-group { margin-top: 0; }
  </style>
</head>
<body>
  <div class="auth-layout">
    <!-- Panel izquierdo: reutilizado -->
    <div class="map-panel" aria-hidden="true">
      <div class="map-bg">
        <svg class="topo-lines" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
          <defs><filter id="blur-slight"><feGaussianBlur stdDeviation="1.2"/></filter></defs>
          <g filter="url(#blur-slight)" stroke="#3BB273" stroke-width="1" fill="none" opacity="0.18">
            <path d="M-40,200 Q100,140 260,180 T600,160"/><path d="M-40,280 Q80,220 240,250 T620,230"/>
            <path d="M-40,360 Q100,295 280,335 T640,310"/><path d="M-40,440 Q80,375 260,410 T640,390"/>
            <path d="M-40,520 Q110,455 290,490 T640,470"/>
          </g>
          <circle cx="180" cy="310" r="5" fill="#E84855" opacity="0.6"/>
          <circle cx="180" cy="310" r="12" fill="#E84855" opacity="0.15"/>
          <circle cx="380" cy="420" r="5" fill="#F2A65A" opacity="0.55"/>
          <circle cx="380" cy="420" r="12" fill="#F2A65A" opacity="0.12"/>
        </svg>
      </div>
      <div class="map-panel-content">
        <div class="brand-mark">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="20" fill="#E84855"/>
            <path d="M20 8C15.03 8 11 12.03 11 17c0 7 9 17 9 17s9-10 9-17c0-4.97-4.03-9-9-9zm0 12.5a3.5 3.5 0 110-7 3.5 3.5 0 010 7z" fill="white"/>
          </svg>
          <span class="brand-name">SafeMap</span>
        </div>
        <div class="panel-tagline">
          <h1>Tu reporte puede salvar una vida.</h1>
          <p>Únete a la comunidad y ayuda a mantener Xalapa segura.</p>
        </div>
        <div class="incident-legend">
          <div class="legend-item"><span class="dot dot--red"></span><span>Incendio</span></div>
          <div class="legend-item"><span class="dot dot--amber"></span><span>Deslave</span></div>
          <div class="legend-item"><span class="dot dot--green"></span><span>Zona segura</span></div>
        </div>
      </div>
    </div>

    <!-- Panel derecho: registro -->
    <div class="form-panel">
      <div class="form-container">
        <div class="form-header">
          <div class="mobile-brand">
            <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
              <circle cx="20" cy="20" r="20" fill="#E84855"/>
              <path d="M20 8C15.03 8 11 12.03 11 17c0 7 9 17 9 17s9-10 9-17c0-4.97-4.03-9-9-9zm0 12.5a3.5 3.5 0 110-7 3.5 3.5 0 010 7z" fill="white"/>
            </svg>
            <span class="brand-name">SafeMap</span>
          </div>
          <h2>Crear cuenta</h2>
          <p class="form-subtitle">Regístrate para publicar reportes y recibir alertas en tu zona.</p>
        </div>

        <form class="auth-form" id="registerForm" novalidate>
          <div class="field-group">
            <label for="name">Nombre completo</label>
            <input type="text" id="name" name="name" placeholder="Tu nombre" autocomplete="name" required />
            <span class="field-error" id="nameError"></span>
          </div>

          <div class="field-group">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" placeholder="tu@correo.com" autocomplete="email" required />
            <span class="field-error" id="emailError"></span>
          </div>

          <div class="field-group">
            <label for="password">Contraseña</label>
            <div class="password-wrap">
              <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" required minlength="8" />
              <button type="button" class="toggle-pass" id="togglePass" aria-label="Mostrar contraseña">
                <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <span class="field-error" id="passwordError"></span>
          </div>

          <button type="submit" class="btn-primary" id="submitBtn">
            <span class="btn-text">Crear cuenta</span>
            <span class="btn-loader" hidden>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="spin">
                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
              </svg>
            </span>
          </button>

          <div class="divider"><span>o</span></div>

          <button type="button" class="btn-google">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Registrarse con Google
          </button>
        </form>

        <p class="register-prompt">¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const submitBtn = document.getElementById('submitBtn');

    document.getElementById('togglePass').addEventListener('click', () => {
      const inp = document.getElementById('password');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.querySelector('.btn-text').hidden = true;
      submitBtn.querySelector('.btn-loader').hidden = false;
      await new Promise(r => setTimeout(r, 1200));
      window.location.href = 'map.html';
    });
  </script>
</body>
</html>
